<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CDS Match</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- <header>
        <h1>Practice through Match-Ups</h1>
        <p>Helps in revision</p>
    </header> -->

    <main>

        <section class="question-box">

            <div class="question-header">
                <span>English • Vocabulary</span>
                <span id="question-number">Question 1</span>
            </div>

            <h2>Match the Following</h2>

            <div class="matching-area">

                <div>
                    <h3>Column A</h3>
                    <div id="column-a"></div>
                </div>

                <div>
                    <h3>Column B</h3>
                    <div id="column-b"></div>
                </div>

            </div>

            <button id="submit-btn">Submit Answer</button>

            <div id="result"></div>

            <button id="next-btn" class="hidden">
                Next Question
            </button>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
